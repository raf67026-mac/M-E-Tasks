# المرحلة الأولى: بناء واجهة الأنغولار
FROM node:20-alpine AS build-stage
WORKDIR /app/frontend
COPY frontend/package*.json ./
RUN npm install
COPY frontend/ .
RUN npm run build

# المرحلة الثانية: تجهيز سيرفر الباكند
FROM node:20-alpine
WORKDIR /app
COPY backend/package*.json ./backend/
RUN cd backend && npm install
COPY backend/ .
COPY prisma ./prisma

# نسخ الملفات التي تم بناؤها من المرحلة الأولى إلى الباكند
# ملاحظة: تأكدي أن مسار dist/frontend/browser هو الصحيح في مشروعك
COPY --from=build-stage /app/frontend/dist/frontend/browser ./backend/public

# تشغيل Prisma وتجهيز السيرفر
RUN npx prisma generate

WORKDIR /app/backend
EXPOSE 3000

# الأمر النهائي: تحديث قاعدة البيانات وتشغيل الموقع
CMD npx prisma migrate deploy && node index.js